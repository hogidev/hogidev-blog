version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --include=dev
    build:
      commands:
        - npx ng build --configuration production
    postBuild:
      commands:
        - test -f dist/hogidev-blog/browser/index.html
        - ls -la dist/hogidev-blog/browser
  artifacts:
    baseDirectory: dist/hogidev-blog/browser
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
