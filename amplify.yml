version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - node -v
        - npm ci
    build:
      commands:
        - npx ng build --configuration production
  artifacts:
    baseDirectory: dist/portfolio-3d/browser
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
